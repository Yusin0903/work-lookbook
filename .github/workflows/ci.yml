name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lookbook
          POSTGRES_PASSWORD: lookbook
          POSTGRES_DB: lookbook_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U lookbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://lookbook:lookbook@localhost:55433/lookbook_test?schema=public

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
